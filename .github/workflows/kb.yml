name: cérebro (kb)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkup do cérebro (conhecimento/ válido + gerados em dia)
        run: npm run kb:check
      - name: Typecheck
        run: npm run typecheck
      - name: Eval do retrieval (golden set, gate hit@4 ≥ 60%)
        run: npm run eval:kb
